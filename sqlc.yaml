version: "2"
sql:
    - engine: "postgresql"
      queries: "internal/db/query"
      schema: "migrations/"
      gen:
          go:
              package: "db"
              out: "internal/db/sqlc"
              sql_package: "pgx/v5"
              emit_json_tags: true            # helpful for JSON APIs
              emit_prepared_queries: false
              emit_interface: true            # allows you to mock the DB for testing
              emit_exact_table_names: false